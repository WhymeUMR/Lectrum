name: lecture-to-flashcards

x-common-build: &common-build
  context: .

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-local}
  NODE_ENV: ${NODE_ENV:-development}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  REDIS_QUEUE_PREFIX: ${REDIS_QUEUE_PREFIX:-lec.local}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
  REDIS_MAX_RETRIES_PER_REQUEST: ${REDIS_MAX_RETRIES_PER_REQUEST:-3}
  REDIS_ENABLE_TLS: ${REDIS_ENABLE_TLS:-false}
  TRANSCRIPTION_CHUNK_SIZE_CHARS: ${TRANSCRIPTION_CHUNK_SIZE_CHARS:-800}
  TRANSCRIPTION_MAX_PARALLEL_CHUNKS: ${TRANSCRIPTION_MAX_PARALLEL_CHUNKS:-4}
  TRANSCRIPTION_CHUNK_DELAY_MS: ${TRANSCRIPTION_CHUNK_DELAY_MS:-25}
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-mock}
  TRANSCRIPTION_PROVIDER_TIMEOUT_MS: ${TRANSCRIPTION_PROVIDER_TIMEOUT_MS:-45000}
  TRANSCRIPTION_PROVIDER_RETRY_ATTEMPTS: ${TRANSCRIPTION_PROVIDER_RETRY_ATTEMPTS:-2}
  TRANSCRIPTION_PROVIDER_RETRY_DELAY_MS: ${TRANSCRIPTION_PROVIDER_RETRY_DELAY_MS:-1000}
  TRANSCRIPTION_OPENAI_MODEL: ${TRANSCRIPTION_OPENAI_MODEL:-whisper-1}
  TRANSCRIPTION_OPENAI_API_KEY: ${TRANSCRIPTION_OPENAI_API_KEY:-}
  TRANSCRIPTION_OPENAI_BASE_URL: ${TRANSCRIPTION_OPENAI_BASE_URL:-https://api.openai.com/v1}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  DEEPGRAM_BASE_URL: ${DEEPGRAM_BASE_URL:-https://api.deepgram.com/v1}
  DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
  ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_multilingual_v2}
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
  ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
  JOB_RESULT_POLL_INTERVAL_MS: ${JOB_RESULT_POLL_INTERVAL_MS:-2000}
  JOB_EXPECTED_MAX_PROCESSING_MS: ${JOB_EXPECTED_MAX_PROCESSING_MS:-900000}
  UPLOAD_MAX_FILE_SIZE_BYTES: ${UPLOAD_MAX_FILE_SIZE_BYTES:-209715200}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_FALLBACK_API_KEY: ${OPENAI_FALLBACK_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  URL_PARSER_SERVICE_URL: ${URL_PARSER_SERVICE_URL:-http://url-parser-service:8000}
  URL_PARSER_TIMEOUT_MS: ${URL_PARSER_TIMEOUT_MS:-180000}
  VIDEO_PARSER_SERVICE_URL: ${VIDEO_PARSER_SERVICE_URL:-http://video-parser-service:8000}
  VIDEO_PARSER_TIMEOUT_MS: ${VIDEO_PARSER_TIMEOUT_MS:-300000}
  CRAWL4AI_API_KEY: ${CRAWL4AI_API_KEY:-}
  CRAWL4AI_LLM_PROVIDER: ${CRAWL4AI_LLM_PROVIDER:-openai/gpt-4.1-mini}
  CRAWL4AI_MAX_TEXT_CHARS: ${CRAWL4AI_MAX_TEXT_CHARS:-400000}
  SUMMARY_AI_TIMEOUT_MS: ${SUMMARY_AI_TIMEOUT_MS:-180000}
  DATABASE_URL: ${DATABASE_URL:-postgres://app:app@postgres:5432/lecture_flashcards}
  ARTIFACTS_DIR: ${ARTIFACTS_DIR:-/app/storage}
  AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
  AUTH_TELEGRAM_BOT_TOKEN: ${AUTH_TELEGRAM_BOT_TOKEN:-}
  AUTH_TELEGRAM_BOT_USERNAME: ${AUTH_TELEGRAM_BOT_USERNAME:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecture_flashcards}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - '15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-lecture_flashcards}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '16379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api-gateway:
    build:
      <<: *common-build
      dockerfile: services/api-gateway/Dockerfile
      args:
        SERVICE_PATH: services/api-gateway
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway
      PORT: 3000
    ports:
      - '3100:3000'
    volumes:
      - artifacts_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:3000/health | grep -q 'ok'"]
      interval: 10s
      timeout: 3s
      retries: 10

  ingestion-service:
    build:
      <<: *common-build
      dockerfile: services/ingestion-service/Dockerfile
      args:
        SERVICE_PATH: services/ingestion-service
    environment:
      <<: *common-env
      SERVICE_NAME: ingestion-service
      PORT: 3000
    ports:
      - '3101:3000'
    volumes:
      - artifacts_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      url-parser-service:
        condition: service_healthy
      video-parser-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:3000/health | grep -q 'ok'"]
      interval: 10s
      timeout: 3s
      retries: 10

  url-parser-service:
    build:
      context: .
      dockerfile: services/url-parser-service/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CRAWL4AI_API_KEY: ${CRAWL4AI_API_KEY:-}
      CRAWL4AI_LLM_PROVIDER: ${CRAWL4AI_LLM_PROVIDER:-openai/gpt-4.1-mini}
      CRAWL4AI_MAX_TEXT_CHARS: ${CRAWL4AI_MAX_TEXT_CHARS:-400000}
    ports:
      - '3107:8000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "python -c \"import urllib.request; import sys; data=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read().decode('utf-8'); sys.exit(0 if 'ok' in data else 1)\""
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  video-parser-service:
    build:
      context: .
      dockerfile: services/video-parser-service/Dockerfile
    environment:
      ARTIFACTS_DIR: ${ARTIFACTS_DIR:-/app/storage}
      VIDEO_PARSER_SOCKET_TIMEOUT_SEC: ${VIDEO_PARSER_SOCKET_TIMEOUT_SEC:-45}
      VIDEO_PARSER_FORMAT: ${VIDEO_PARSER_FORMAT:-bestaudio/best}
    ports:
      - '3108:8000'
    volumes:
      - artifacts_data:/app/storage
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "python -c \"import urllib.request; import sys; data=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read().decode('utf-8'); sys.exit(0 if 'ok' in data else 1)\""
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  transcription-worker:
    build:
      <<: *common-build
      dockerfile: services/transcription-worker/Dockerfile
      args:
        SERVICE_PATH: services/transcription-worker
    environment:
      <<: *common-env
      SERVICE_NAME: transcription-worker
      PORT: 3000
    ports:
      - '3102:3000'
    volumes:
      - artifacts_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:3000/health | grep -q 'ok'"]
      interval: 10s
      timeout: 3s
      retries: 10

  flashcard-worker:
    build:
      <<: *common-build
      dockerfile: services/flashcard-worker/Dockerfile
      args:
        SERVICE_PATH: services/flashcard-worker
    environment:
      <<: *common-env
      SERVICE_NAME: flashcard-worker
      PORT: 3000
    ports:
      - '3103:3000'
    volumes:
      - artifacts_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:3000/health | grep -q 'ok'"]
      interval: 10s
      timeout: 3s
      retries: 10

  highlight-worker:
    build:
      <<: *common-build
      dockerfile: services/highlight-worker/Dockerfile
      args:
        SERVICE_PATH: services/highlight-worker
    environment:
      <<: *common-env
      SERVICE_NAME: highlight-worker
      PORT: 3000
    ports:
      - '3104:3000'
    volumes:
      - artifacts_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:3000/health | grep -q 'ok'"]
      interval: 10s
      timeout: 3s
      retries: 10

  summary-worker:
    build:
      <<: *common-build
      dockerfile: services/summary-worker/Dockerfile
      args:
        SERVICE_PATH: services/summary-worker
    environment:
      <<: *common-env
      SERVICE_NAME: summary-worker
      PORT: 3000
    ports:
      - '3105:3000'
    volumes:
      - artifacts_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:3000/health | grep -q 'ok'"]
      interval: 10s
      timeout: 3s
      retries: 10

  summary-fallback-worker:
    build:
      <<: *common-build
      dockerfile: services/summary-fallback-worker/Dockerfile
      args:
        SERVICE_PATH: services/summary-fallback-worker
    environment:
      <<: *common-env
      SERVICE_NAME: summary-fallback-worker
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_FALLBACK_API_KEY:-}
    ports:
      - '3106:3000'
    volumes:
      - artifacts_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:3000/health | grep -q 'ok'"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend-prototype:
    build:
      <<: *common-build
      dockerfile: services/lectrum-frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3100}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '80:3000'
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  artifacts_data:
