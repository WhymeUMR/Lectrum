name: E2E Pipeline

on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  e2e-local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E local stack
        run: npm run test:e2e
